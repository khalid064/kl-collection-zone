<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | KL COLLECTION ZONE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0d192b;
      color: #fff;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      border-radius: 16px;
      background: #172b43;
      box-shadow: 0 12px 35px #0005;
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    p {
      color: #c6d4e4;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #52677f;
      border-radius: 8px;
      background: #0d192b;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #39bdf2;
      color: #071525;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    a {
      color: #54c9ff;
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <h1>Reset Your Password</h1>
    <p>আপনার Admin Dashboard-এর জন্য নতুন পাসওয়ার্ড সেট করুন।</p>

    <form id="resetForm">
      <label for="newPassword">New Password</label>
      <input id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="কমপক্ষে ৮ অক্ষর"
        required>

      <label for="confirmPassword">Confirm New Password</label>
      <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password"
        placeholder="পাসওয়ার্ড আবার লিখুন" required>

      <button id="submitButton" type="submit">Update Password</button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <script>
    const SUPABASE_URL = "https://jkrqqbnvugatrutakgoz.supabase.co";

    // এখানে admin.js ফাইলে ব্যবহৃত একই Publishable/anon key বসাবেন।
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_N0qDjtf5y_pVhwKwXAQRrQ_CKgjk3m_";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("resetForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    async function checkRecoverySession() {
      const { data, error } = await db.auth.getSession();

      if (error || !data.session) {
        message.textContent =
          "Reset link কাজ করছে না বা মেয়াদ শেষ হয়েছে। নতুন Password Recovery ইমেইল নিন।";
        form.style.display = "none";
        return false;
      }

      return true;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const password = document.getElementById("newPassword").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent = "পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "দুটি পাসওয়ার্ড মিলছে না।";
        return;
      }

      button.disabled = true;
      message.textContent = "পাসওয়ার্ড আপডেট হচ্ছে...";

      const { error } = await db.auth.updateUser({
        password: password
      });

      button.disabled = false;

      if (error) {
        message.textContent = "সমস্যা: " + error.message;
        return;
      }

      message.textContent =
        "পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে। Admin Login পেজে নেওয়া হচ্ছে...";

      setTimeout(() => {
        window.location.href = "/admin.html";
      }, 2000);
    });

    checkRecoverySession();
  </script>
</body>

</html>
